<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
        <script src="scripts.js"></script>
    <title>Previsão do Tempo</title>
</head>

<body>
    <div class="big-box">
        <div>

            <input class="input-cidade" placeholder="Digite o nome da cidade">
            <button class="botao-busca" onclick="pesquisaBotao()">
                <img class="img-busca" src="https://www.svgrepo.com/show/488200/find.svg" alt="Buscar">
            </button>

            <div class="mid-box">
            <h2 class="cidade">Tempo em São Paulo</h2>

            <p class="temperatura">21 graus</p>
            <div class="small-box">
                <img class="img_previsao"  src="https://openweathermap.org/img/wn/04n.png" alt="Ícone do tempo.">
                <p class="texto-previsao">Nublado</p>
            </div>

            <p class="umidade">Umidade: 76%</p>
            </div>


        </div>
    </div>

</body>

</html>
